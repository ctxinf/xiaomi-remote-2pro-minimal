## Xiaomi Remote Pro 2 Gateway — real-use deployment config.
##
## One file drives everything: how the systemd unit is generated, and what the
## `end` hook does with each recording (audio -> Aliyun ASR -> LLM -> clipboard).
##
## Installed to ~/.config/xiaomi-remote-gateway/config.toml
## Re-run `./install-service.sh install` after editing to apply unit changes;
## changes under [asr]/[llm]/[output]/[audio] take effect on the next recording
## with no restart, because the hook re-reads this file every time it runs.
##
## NO CREDENTIALS IN THIS FILE. Write `${secret:name}` and put the value in the
## encrypted store:
##     ./install-service.sh secret add dashscope_api_key sk-xxxxxxxx

[service]
name = "xiaomi-remote-gateway"
description = "Xiaomi Remote Pro 2 voice gateway (voice -> ASR -> LLM)"
# Seconds to wait before restarting after a crash.
restart_sec = 5

[gateway]
# "auto" finds the release build in this checkout; the installer copies it into
# ~/.local/share/xiaomi-remote-gateway/bin so the service survives a `git clean`.
binary = "auto"
# Empty = $TMPDIR/xiaomi-remote-gateway.
record_dir = ""
gain_db = 0.0
# Fallback retention for recordings the hook did not consume (0 = unlimited).
keep_hours = 24
keep_max = 100
# Mic-key suppression. Keep "auto" if keyd (or any other remapper) already
# grabs the remote — the gateway then leaves the input layer entirely alone
# instead of fighting it for the exclusive EVIOCGRAB.
#   auto   = suppress only when nothing else owns the device  (default)
#   always = always grab; needs /dev/uinput (see scripts/setup-uinput.sh)
#   never  = never touch the input layer
voice_key = "auto"
# Optional BLE name filter; empty = autodetect.
device_name = ""
verbose = false
extra_args = []

## --- Step 1: speech to text ------------------------------------------------
## Aliyun DashScope (百炼) in OpenAI-compatible mode. The WAV goes up as a
## base64 `input_audio` part; the model answers with the transcript.
[asr]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3-asr-flash"
api_key = "${secret:dashscope_api_key}"
# Bare language code. "zh-CN" is rejected by the API; "" lets it autodetect.
language = "zh"
timeout_sec = 60
max_audio_bytes = 8388608

## --- Step 2: transcript post-processing ------------------------------------
## Any OpenAI-compatible endpoint (DashScope, OpenAI, a local vLLM/Ollama...).
## Set enabled = false to put the raw transcript straight on the clipboard.
[llm]
enabled = true
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-flash"
api_key = "${secret:llm_api_key}"
temperature = 0.2
timeout_sec = 60
max_input_chars = 4000
system_prompt = """
你是语音转写的后处理器。输入是一段中文语音识别结果，可能有口癖、重复、缺标点。
请输出清理后的文本：补全标点、去掉"嗯/那个/就是"之类的口水词、修正明显的同音错别字。
不要翻译、不要扩写、不要总结、不要添加任何解释或前后缀，只输出清理后的正文。
"""

## --- Step 3: where the text goes -------------------------------------------
[output]
# "llm" uses the post-processed text (falling back to the raw transcript if
# step 2 is disabled or failed); "asr" always uses the raw transcript.
use = "llm"
clipboard = true
# Fallback desktop notification, used only when the indicator below is off or
# its CLI is missing. The two never both fire for the same event.
notify = true
# Optional extra command; the text arrives on its stdin, never as an argument.
# command = ["/home/you/bin/handle-voice.sh"]
command = []

# Append every result as JSON Lines; log = "" disables it.
# This is the only file here that would otherwise grow forever (recordings are
# reaped by keep_hours/keep_max, and the service log is vacuumed by journald),
# so it is rotated at max_bytes, keeping one previous generation as ".jsonl.1".
[output.transcript]
log = ""
max_bytes = 1048576

# --- The on-screen popup ----------------------------------------------------
# Live overlay via my-custom-gnome-indicator-cli. ONE popup, rewritten in place
# (same --id) as the recording moves through three stages:
#
#   按下按键 ──录音──> 松开按键 ──ASR/LLM──> 出结果
#      [recording]        [working]         [result]
#
# Each stage is a table below and answers the same few questions: show it at
# all? drawn how? for how long at most? Requires the GNOME extension; without
# it this quietly does nothing and you get the single notification above.
[output.indicator]
enabled = true
cli = "my-custom-gnome-indicator-cli"
position = "top-left"              # top-left … bottom-right, or "center"
# How the "live" stages show that they are running. A progress bar is not an
# option: nothing here knows how long it has left, so there would be no honest
# position to draw. "spinner" needs GNOME 49+ and silently becomes the pulse
# bar below that.
indeterminate = "spinner"          # spinner|pulse
# Slow on purpose, way past the CLI's own "slow" (400ms): fades and colour
# changes at this speed register without interrupting, and they cost exactly
# nothing, since the Shell draws every frame from the single call made here.
# Only applies to "live" stages; the result stage never animates.
animate = "2500ms"                 # off|fast|normal|slow, or 250 / 1.2s

# Every stage takes `show`. Turning one off also takes the popup down at that
# point, so the previous stage never lingers: with working.show = false the
# 正在录音… popup disappears the moment the key comes up. All three off is the
# same as enabled = false. With result.show = false the result falls back to
# the notification above (silence that too with notify = false).
#
# The two in-progress stages also take `style`:
#   "minimal"  one line, no motion at all; running is just the trailing "…"
#   "live"     spinner + slow fades and colour transitions
# The result stage has no style: nothing is still running, so it has no spinner,
# and it never animates — motion on the one line you are actually trying to
# read is only noise. No stage draws an icon or a title either; both are fixed
# strings that say nothing new and cost a line of height every time you speak.
#
# `ttl_sec` is a dead-man timer: how long that stage's popup may stay up when
# the next stage never arrives (a press too short to record, a service
# restarted mid-recording, a run killed mid-ASR). A normal run replaces each
# popup long before this matters. The working stage derives its own from the
# asr/llm timeouts above, so it only needs a value here if you disagree.
[output.indicator.recording]       # 按下按键 → 正在录音…
show = true
style = "live"
ttl_sec = 300

[output.indicator.working]         # 松开按键 → 识别中… / 后处理中…
show = true
style = "live"

# The result is the only stage with a real display duration: nothing follows
# it, so these are exactly how long you look at it. The other two are normally
# overwritten within milliseconds of their step ending — their ttl_sec is a
# ceiling for when that never happens, not a viewing time.
# A result you can already paste needs a glance (the text hit the clipboard
# before this popup existed, so it is a receipt); an error you have to read.
# 0 = stay until the next recording replaces it.
[output.indicator.result]          # ASR 返回 → 识别文本：xxx
show = true
duration_sec = 2.5                 # 成功
error_duration_sec = 8             # 失败 / 识别为空

# Deliberately quiet: this goes up on every sentence you speak, so it has to be
# legible at a glance and easy to ignore the rest of the time. The accent colour
# (left bar + spinner) is the only saturated thing left, and it is not a knob
# because it carries meaning: red while the mic is live, blue while the network
# is working, green for the result — the Shell cross-fades between them itself.
[output.indicator.look]
bg = "slate-950/78"
border = "white/12"
text = "slate-300"
padding = "tight"                  # none|tight|compact|normal|loose, px, or "6px 10px"
radius = "md"                      # none|sm|md|lg|xl|2xl|3xl|full, or px

[audio]
# Delete the WAV once it has been transcribed. Failed runs always keep theirs.
delete_after = true
# Ignore recordings shorter than this (the gateway already drops sub-50ms ones).
min_duration_sec = 0.3
