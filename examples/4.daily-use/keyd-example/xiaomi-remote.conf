# Reference keyd config for the Xiaomi Bluetooth Remote 2 Pro (RC003 / ARN9).
#
#   sudo cp xiaomi-remote.conf /etc/keyd/
#   sudo keyd reload
#
# Division of labour with the gateway, and why this file is the right place for
# it: the mic button travels two independent paths — a BLE ATVV voice stream
# (which the gateway consumes) and a plain HID keypress (which reaches the
# desktop). Only the second one needs suppressing, and keyd already owns the
# device exclusively (EVIOCGRAB), so the gateway stays out of the input layer
# entirely — its default `voice_key = "auto"` detects keyd and stands down.
# Do not also set `voice_key = "always"`: the two would fight over the grab.

[ids]
# Device id of the remote. `sudo keyd monitor` prints the exact id, including
# the trailing hash that keyd appends when several devices share a vendor:product.
2717:32b8

[main]

# --- microphone button -----------------------------------------------------
# It emits BOTH of these, so both need dropping: f5 is VS Code's "start
# debugging", and f20 is free by default but bindable in fcitx5 / GNOME —
# missing it is the classic "mostly works, then one day it doesn't".
f5 = noop
f20 = noop
# Some firmware revisions send these instead; harmless to keep noop'd.
search = noop

# --- paste ------------------------------------------------------------------
# The pipeline ends at the clipboard (Wayland has no SendInput() equivalent —
# see the main README), so one remote key is worth spending on the paste.
power = C-v

# --- everything else --------------------------------------------------------
# The remote is a remote, not a keyboard: its nav keys landing in whatever
# window has focus is rarely what you want. Drop them, then un-drop the ones
# you actually want by replacing `noop` with a real binding.
volumeup = noop
volumedown = noop
back = noop
compose = noop
` = noop
enter = noop
home = noop
left = noop
right = noop
up = noop
down = noop
